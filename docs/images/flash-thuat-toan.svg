<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1540" viewBox="0 0 1200 1540">
<style>text{font-family:Arial,sans-serif;fill:#102a43}.t{font-size:28px;font-weight:bold}.s{font-size:20px}.box{fill:#f8fbff;stroke:#1769aa;stroke-width:3}.q{fill:#fff8e1;stroke:#cc8a00;stroke-width:3}.arr{stroke:#334e68;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#334e68"/></marker></defs>
<text x="600" y="45" text-anchor="middle" class="t">CÁC THUẬT TOÁN THAO TÁC FLASH</text>
<g transform="translate(55 85)"><text x="0" y="0" class="t">1. Đọc Flash</text><rect class="box" x="0" y="28" width="500" height="75" rx="8"/><text x="250" y="72" text-anchor="middle" class="s">Đặt LATENCY trong FLASH_ACR</text><line class="arr" x1="250" y1="103" x2="250" y2="145"/><rect class="q" x="95" y="145" width="310" height="75" rx="8"/><text x="250" y="190" text-anchor="middle" class="s">BSY = 1 trong FLASH_SR?</text><line class="arr" x1="250" y1="220" x2="250" y2="264"/><rect class="box" x="0" y="264" width="500" height="75" rx="8"/><text x="250" y="309" text-anchor="middle" class="s">Đọc trực tiếp địa chỉ Flash</text><text x="420" y="181" class="s">Có: chờ</text><text x="270" y="250" class="s">Không</text></g>
<g transform="translate(650 85)"><text x="0" y="0" class="t">2. Ghi Flash 16-bit</text><rect class="box" x="0" y="28" width="500" height="58" rx="8"/><text x="250" y="64" text-anchor="middle" class="s">Đọc LOCK trong FLASH_CR</text><line class="arr" x1="250" y1="86" x2="250" y2="111"/><rect class="q" x="100" y="111" width="300" height="58" rx="8"/><text x="250" y="147" text-anchor="middle" class="s">LOCK = 1?</text><line class="arr" x1="250" y1="169" x2="250" y2="194"/><rect class="box" x="0" y="194" width="500" height="72" rx="8"/><text x="250" y="226" text-anchor="middle" class="s">KEY1 = 0x45670123; KEY2 = 0xCDEF89AB</text><text x="250" y="252" text-anchor="middle" class="s">vào FLASH_KEYR</text><line class="arr" x1="250" y1="266" x2="250" y2="291"/><rect class="box" x="0" y="291" width="500" height="58" rx="8"/><text x="250" y="327" text-anchor="middle" class="s">Đặt PG = 1 trong FLASH_CR</text><line class="arr" x1="250" y1="349" x2="250" y2="374"/><rect class="box" x="0" y="374" width="500" height="58" rx="8"/><text x="250" y="410" text-anchor="middle" class="s">Ghi 16 bit vào địa chỉ Flash</text><line class="arr" x1="250" y1="432" x2="250" y2="457"/><rect class="q" x="100" y="457" width="300" height="58" rx="8"/><text x="250" y="493" text-anchor="middle" class="s">BSY = 1? Chờ đến khi = 0</text><line class="arr" x1="250" y1="515" x2="250" y2="540"/><rect class="box" x="0" y="540" width="500" height="58" rx="8"/><text x="250" y="576" text-anchor="middle" class="s">Đọc lại và so sánh giá trị</text></g>
<g transform="translate(55 500)"><text x="0" y="0" class="t">3. Xóa một trang Flash</text><rect class="box" x="0" y="28" width="500" height="58" rx="8"/><text x="250" y="64" text-anchor="middle" class="s">Mở khóa Flash nếu LOCK = 1</text><line class="arr" x1="250" y1="86" x2="250" y2="111"/><rect class="box" x="0" y="111" width="500" height="58" rx="8"/><text x="250" y="147" text-anchor="middle" class="s">Đặt PER = 1 trong FLASH_CR</text><line class="arr" x1="250" y1="169" x2="250" y2="194"/><rect class="box" x="0" y="194" width="500" height="58" rx="8"/><text x="250" y="230" text-anchor="middle" class="s">Ghi địa chỉ trang vào FLASH_AR/FAR</text><line class="arr" x1="250" y1="252" x2="250" y2="277"/><rect class="box" x="0" y="277" width="500" height="58" rx="8"/><text x="250" y="313" text-anchor="middle" class="s">Đặt STRT = 1, chờ BSY = 0</text><line class="arr" x1="250" y1="335" x2="250" y2="360"/><rect class="box" x="0" y="360" width="500" height="58" rx="8"/><text x="250" y="396" text-anchor="middle" class="s">Kiểm tra mọi nửa từ = 0xFFFF</text></g>
<g transform="translate(650 740)"><text x="0" y="0" class="t">4. Xóa toàn bộ Flash</text><rect class="box" x="0" y="28" width="500" height="58" rx="8"/><text x="250" y="64" text-anchor="middle" class="s">Mở khóa Flash nếu LOCK = 1</text><line class="arr" x1="250" y1="86" x2="250" y2="111"/><rect class="box" x="0" y="111" width="500" height="58" rx="8"/><text x="250" y="147" text-anchor="middle" class="s">Đặt MER = 1 trong FLASH_CR</text><line class="arr" x1="250" y1="169" x2="250" y2="194"/><rect class="box" x="0" y="194" width="500" height="58" rx="8"/><text x="250" y="230" text-anchor="middle" class="s">Đặt STRT = 1</text><line class="arr" x1="250" y1="252" x2="250" y2="277"/><rect class="q" x="100" y="277" width="300" height="58" rx="8"/><text x="250" y="313" text-anchor="middle" class="s">BSY = 1? Chờ đến khi = 0</text><line class="arr" x1="250" y1="335" x2="250" y2="360"/><rect class="box" x="0" y="360" width="500" height="58" rx="8"/><text x="250" y="396" text-anchor="middle" class="s">Kiểm tra vùng Flash = 0xFFFF</text></g>
</svg>
